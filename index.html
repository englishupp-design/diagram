<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindLander — Emotional Intelligence</title>
<meta name="description" content="MindLander — Emotional Intelligence School for Leaders, Educators and Business.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #EDE0CE;
    --bg-card:     #F5EAD8;
    --white:       #ffffff;
    --teal-light:  #5BB8B2;
    --teal-mid:    #3D6B6B;
    --sand:        #C9A87C;
    --sand-light:  #DFC9A8;
    --teal-dark:   #2D4A4A;
    --deep-teal:   #1E3535;
    --charcoal:    #252B2B;
    --near-black:  #1A1F1F;
    --text-dark:   #1A1F1F;
    --text-mid:    #3D5A4A;
    --off-white:   #EDE0CE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text-dark);overflow-x:hidden;}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(30,53,53,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,124,0.18);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:68px;}
  .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-brand img{height:44px;width:auto;}
  .nav-links{display:flex;gap:2px;list-style:none;}
  .nav-links a{text-decoration:none;color:rgba(237,224,206,0.75);font-size:0.88rem;font-weight:400;letter-spacing:0.03em;padding:8px 16px;border-radius:6px;transition:all 0.2s;}
  .nav-links a:hover{color:var(--sand-light);background:rgba(201,168,124,0.1);}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .lang-switcher{display:flex;border:1px solid rgba(201,168,124,0.35);border-radius:8px;overflow:hidden;}
  .lang-btn{background:none;border:none;cursor:pointer;padding:6px 14px;font-size:0.8rem;font-weight:600;font-family:"DM Sans",sans-serif;letter-spacing:0.05em;color:rgba(237,224,206,0.6);transition:all 0.2s;}
  .lang-btn.active{background:var(--teal-dark);color:var(--white);}
  .lang-btn:not(.active):hover{background:rgba(201,168,124,0.15);}
  .nav-cta{background:var(--sand)!important;color:var(--near-black)!important;padding:9px 22px!important;border-radius:4px!important;font-size:0.88rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;transition:all 0.25s;}
  .nav-cta:hover{background:var(--sand-light)!important;transform:translateY(-1px);}
  .nav-book{background:transparent!important;color:var(--teal-light)!important;padding:9px 22px!important;border-radius:4px!important;border:1px solid var(--teal-light)!important;font-size:0.88rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;transition:all 0.25s;}
  .nav-book:hover{background:var(--teal-light)!important;color:var(--near-black)!important;transform:translateY(-1px);}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:120px 5% 80px;
    position:relative;
    overflow:hidden;
    /* Background image with fallback gradient */
    background-image: url('https://raw.githubusercontent.com/englishupp-design/diagram/main/photo.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  /* Dark overlay to ensure text readability over the photo */
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(
      160deg,
      rgba(8,12,12,0.96) 0%,
      rgba(15,25,25,0.93) 55%,
      rgba(25,45,45,0.88) 100%
    );
    z-index:0;
  }
  /* Subtle radial accents on top of the overlay */
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 70% 30%,rgba(91,184,178,0.1) 0%,transparent 70%),
      radial-gradient(ellipse 40% 60% at 20% 80%,rgba(201,168,124,0.08) 0%,transparent 70%);
    z-index:1;
  }
  .hero > *{position:relative;z-index:2;}
  .hero-logo{width:180px;height:auto;margin-bottom:24px;filter:drop-shadow(0 8px 32px rgba(0,0,0,0.6));}
  .hero-eyebrow{font-size:1rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--sand-light);margin-bottom:20px;opacity:1;text-shadow:0 2px 8px rgba(0,0,0,0.6);}
  .hero h1{font-family:"Cormorant Garamond",serif;font-size:clamp(2.6rem,5.5vw,4.8rem);font-weight:400;color:var(--white);line-height:1.25;max-width:820px;background:rgba(10,18,18,0.65);backdrop-filter:blur(10px);border:1px solid rgba(91,184,178,0.25);border-radius:16px;padding:32px 48px;box-shadow:0 8px 48px rgba(0,0,0,0.5);text-shadow:0 2px 16px rgba(0,0,0,0.5);}
  .hero h1 em{font-style:italic;color:var(--sand-light);text-shadow:0 2px 12px rgba(0,0,0,0.4);}

  /* SECTIONS */
  section{padding:100px 5%;}
  .section-inner{max-width:1100px;margin:0 auto;}
  .section-label{font-size:0.75rem;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;color:var(--teal-mid);margin-bottom:16px;}
  .section-title{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,4vw,3rem);font-weight:400;color:var(--near-black);line-height:1.2;margin-bottom:48px;}
  .divider{width:48px;height:2px;background:var(--sand);margin-bottom:32px;}

  /* CARDS */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;}
  .card{background:var(--white);border:1px solid rgba(45,74,74,0.12);border-radius:16px;padding:36px 32px;transition:all 0.3s;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal-dark),var(--sand));transform:scaleX(0);transform-origin:left;transition:transform 0.3s;}
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(45,74,74,0.12);}
  .card:hover::before{transform:scaleX(1);}
  .card-num{font-family:"Cormorant Garamond",serif;font-size:3rem;font-weight:300;color:var(--sand-light);line-height:1;margin-bottom:20px;}
  .card p{font-size:1.05rem;font-weight:300;line-height:1.8;color:var(--text-mid);}

  /* TAGS */
  .tags-wrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
  .tag{background:var(--teal-dark);color:var(--white);padding:10px 22px;border-radius:100px;font-size:0.88rem;cursor:pointer;display:inline-block;transition:transform 0.15s,box-shadow 0.15s;user-select:none;}
  .tag:hover{background:var(--teal-mid);transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,74,74,0.3);}
  .tag.pop{animation:tagPop 0.5s cubic-bezier(0.36,0.07,0.19,0.97);}
  @keyframes tagPop{0%{transform:scale(1);background:var(--teal-dark);}20%{transform:scale(1.18);background:var(--sand);color:var(--near-black);box-shadow:0 8px 28px rgba(201,168,124,0.5);}50%{transform:scale(0.95);}75%{transform:scale(1.06);}100%{transform:scale(1);background:var(--teal-dark);color:var(--white);box-shadow:none;}}

  /* QUOTES / EQ */
  .quotes-section{
    background-image: url('https://raw.githubusercontent.com/englishupp-design/diagram/main/photo%202.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    position: relative;
  }
  .quotes-section::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(5,10,10,0.82);
    z-index:0;
  }
  .quotes-section .section-inner{position:relative;z-index:1;}
  .quotes-section .section-label{color:var(--sand);position:relative;z-index:1;}
  .quotes-list{display:flex;flex-direction:column;max-width:840px;margin-top:48px;}
  .quote-item{display:flex;align-items:flex-start;gap:28px;padding:22px 28px;margin-bottom:12px;border-radius:12px;background:rgba(5,10,10,0.65);backdrop-filter:blur(16px);border:1px solid rgba(217,224,227,0.22);border-left:3px solid rgba(217,224,227,0.5);opacity:0;transform:translateX(-16px);transition:opacity 0.5s ease,transform 0.5s ease;}
  .quote-item.visible{opacity:1;transform:translateX(0);}
  .quote-item:last-of-type{margin-bottom:0;}
  .quote-num{font-family:"Cormorant Garamond",serif;font-size:3.5rem;font-weight:300;color:rgba(217,224,227,0.5);line-height:1;flex-shrink:0;width:52px;text-align:right;}
  .quote-body{padding-top:8px;}
  .quote-lead{font-family:"Cormorant Garamond",serif;font-size:clamp(1.3rem,2.5vw,1.75rem);font-weight:400;color:#eaf0f2;line-height:1.4;text-shadow:0 1px 10px rgba(0,0,0,0.9);}
  .quote-lead em{font-style:italic;color:var(--teal-light);}
  .quotes-cta-block{margin-top:40px;padding:28px 36px;background:rgba(5,10,10,0.65);backdrop-filter:blur(16px);border:1px solid rgba(217,224,227,0.22);border-radius:14px;display:inline-block;max-width:480px;}
  .quotes-cta-block p{font-family:"Cormorant Garamond",serif;font-size:1.5rem;font-style:italic;color:#eaf0f2;line-height:1.4;text-shadow:0 1px 10px rgba(0,0,0,0.9);}

  /* MODEL */
  .model-flow{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:48px;}
  .model-box{background:rgba(91,184,178,0.12);border:1px solid rgba(91,184,178,0.3);border-radius:12px;padding:24px 40px;font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:var(--white);}
  .model-arrow{font-size:1.5rem;color:var(--sand);}
  .model-result{background:var(--sand);border:none;color:var(--near-black);font-weight:600;}

  /* WHO WE ARE - speaker cards */
  .speakers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;margin-top:48px;}
  .speaker-card{background:var(--white);border:1.5px solid var(--teal-dark);border-radius:20px;padding:40px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform 0.3s,box-shadow 0.3s;}
  .speaker-card:hover{transform:translateY(-8px);box-shadow:0 24px 56px rgba(45,74,74,0.12);}
  .speaker-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:top;margin-bottom:24px;border:3px solid var(--sand-light);}
  .speaker-photo-placeholder{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--teal-dark),var(--teal-mid));margin-bottom:24px;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:2.5rem;color:var(--sand-light);}
  .speaker-name{font-family:"Cormorant Garamond",serif;font-size:1.7rem;font-weight:600;color:var(--near-black);margin-bottom:6px;}
  .speaker-title{font-size:0.82rem;color:var(--teal-mid);letter-spacing:0.05em;margin-bottom:20px;line-height:1.5;}
  .speaker-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px;}
  .speaker-tag{background:rgba(45,74,74,0.08);border-radius:100px;padding:4px 12px;font-size:0.75rem;color:var(--teal-dark);font-weight:500;}
  .bio-toggle{background:none;border:none;font-size:0.85rem;font-weight:500;color:var(--teal-dark);cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 16px;border-radius:6px;transition:background 0.2s;}
  .bio-toggle:hover{background:rgba(45,74,74,0.07);}
  .bio-arrow{transition:transform 0.3s;}
  .bio-content{max-height:0;overflow:hidden;transition:max-height 0.5s ease,opacity 0.4s ease;opacity:0;width:100%;text-align:left;margin-top:16px;}
  .bio-content p{font-size:0.88rem;color:var(--text-mid);line-height:1.8;font-weight:300;padding-top:16px;border-top:1px solid rgba(45,74,74,0.1);}
  .bio-link{display:inline-flex;align-items:center;gap:6px;color:var(--teal-dark);text-decoration:none;font-size:0.85rem;font-weight:600;margin-top:12px;transition:gap 0.2s;}
  .bio-link:hover{gap:10px;}
  .bio-link::after{content:"→";}

  /* REVIEWS */
  .reviews-slider-wrap{position:relative;}
  .reviews-track-outer{overflow:hidden;}
  .reviews-track{display:flex;gap:28px;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);}
  .review-card{background:var(--white);border:1px solid rgba(45,74,74,0.1);border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:20px;transition:transform 0.35s,box-shadow 0.35s;cursor:default;position:relative;overflow:hidden;flex:0 0 calc((100% - 56px) / 3);min-width:0;}
  .review-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal-dark),var(--sand));transform:scaleX(0);transform-origin:left;transition:transform 0.35s;}
  .review-card:hover{transform:translateY(-6px);box-shadow:0 24px 56px rgba(45,74,74,0.12);}
  .review-card:hover::before{transform:scaleX(1);}
  .review-stars{color:var(--sand);font-size:1.2rem;letter-spacing:3px;}
  .review-text-wrap{position:relative;}
  .review-text{font-size:0.92rem;color:var(--text-mid);line-height:1.85;font-weight:300;overflow:hidden;max-height:112px;transition:max-height 0.5s ease;}
  .review-text.expanded{max-height:600px;}
  .review-fade{position:absolute;bottom:0;left:0;right:0;height:48px;background:linear-gradient(transparent,var(--white));transition:opacity 0.3s;pointer-events:none;}
  .review-fade.hidden{opacity:0;}
  .review-toggle{background:none;border:none;font-size:0.82rem;font-weight:500;color:var(--teal-dark);cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;transition:color 0.2s;margin-top:-8px;}
  .review-toggle:hover{color:var(--teal-mid);}
  .review-toggle svg{transition:transform 0.3s;}
  .review-toggle.expanded svg{transform:rotate(180deg);}
  .review-footer{border-top:1px solid rgba(45,74,74,0.08);padding-top:16px;margin-top:auto;}
  .review-name{font-family:"Cormorant Garamond",serif;font-size:1.2rem;font-weight:600;color:var(--near-black);margin-bottom:4px;}
  .review-meta{font-size:0.8rem;color:var(--teal-mid);letter-spacing:0.04em;}
  .reviews-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:40px;}
  .reviews-arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(45,74,74,0.18);background:var(--white);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
  .reviews-arrow:hover{background:var(--teal-dark);color:var(--white);border-color:var(--teal-dark);}
  .reviews-arrow:disabled{opacity:0.3;cursor:default;pointer-events:none;}
  .reviews-dots{display:flex;gap:8px;}
  .reviews-dot{width:8px;height:8px;border-radius:50%;background:rgba(45,74,74,0.2);cursor:pointer;transition:all 0.25s;border:none;padding:0;}
  .reviews-dot.active{background:var(--teal-dark);transform:scale(1.25);}
  @media(max-width:900px){.review-card{flex:0 0 calc((100% - 28px) / 2);}}
  @media(max-width:600px){.review-card{flex:0 0 100%;}}

  /* TABS */
  .tabs-nav{display:flex;gap:4px;border-bottom:1px solid rgba(201,168,124,0.25);margin-bottom:48px;margin-top:32px;}
  .tab-btn{padding:12px 28px;font-size:0.9rem;font-weight:400;letter-spacing:0.04em;color:rgba(237,224,206,0.5);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;font-family:"DM Sans",sans-serif;}
  .tab-btn.active{color:var(--sand-light);border-bottom-color:var(--sand);}
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* OFFERINGS */
  .offerings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:8px;}
  .offering-card{background:rgba(10,18,18,0.75);border:1px solid rgba(201,168,124,0.35);border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:16px;transition:all 0.3s;cursor:pointer;}
  .offering-card:hover{background:rgba(91,184,178,0.15);border-color:rgba(91,184,178,0.5);transform:translateY(-4px);}
  .offering-card--featured{border-color:rgba(201,168,124,0.65);background:rgba(10,18,18,0.8);}
  .offering-card.pop{animation:offeringPop 0.5s cubic-bezier(0.36,0.07,0.19,0.97);}
  @keyframes offeringPop{
    0%  {transform:scale(1);}
    20% {transform:scale(1.03);box-shadow:0 8px 32px rgba(201,168,124,0.45);border-color:rgba(201,168,124,0.9);}
    50% {transform:scale(0.98);}
    75% {transform:scale(1.015);}
    100%{transform:scale(1);box-shadow:none;}
  }
  .offering-tag{display:inline-block;font-size:0.7rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:5px 14px;border-radius:100px;background:rgba(91,184,178,0.3);color:var(--sand-light);width:fit-content;}
  .offering-tag--gold{background:rgba(201,168,124,0.25);color:var(--sand-light);}
  .offering-title{font-family:"Cormorant Garamond",serif;font-size:1.75rem;font-weight:400;color:#d9e0e3;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,0.7);}
  .offering-desc{font-size:1rem;color:rgba(237,224,206,0.9);line-height:1.8;font-weight:400;flex:1;text-shadow:0 1px 6px rgba(0,0,0,0.6);}

  /* BIZ GRID */
  .biz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
  .biz-card{background:rgba(10,18,18,0.75);border:1px solid rgba(201,168,124,0.3);border-radius:16px;padding:32px 28px;transition:all 0.3s;cursor:pointer;}
  .biz-card:hover{background:rgba(91,184,178,0.15);border-color:rgba(91,184,178,0.5);transform:translateY(-4px);}
  .biz-card.pop{animation:offeringPop 0.5s cubic-bezier(0.36,0.07,0.19,0.97);}
  .biz-intro-box{font-size:1rem;line-height:1.85;color:rgba(237,224,206,0.9);max-width:700px;font-weight:400;margin-bottom:48px;text-shadow:0 1px 6px rgba(0,0,0,0.6);background:rgba(10,18,18,0.75);backdrop-filter:blur(12px);border:1px solid rgba(217,224,227,0.18);border-left:3px solid rgba(217,224,227,0.35);border-radius:12px;padding:22px 28px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;user-select:none;}
  .biz-intro-box:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,74,74,0.3);}
  .biz-intro-box.pop{animation:bizPop 0.5s cubic-bezier(0.36,0.07,0.19,0.97);}
  @keyframes bizPop{
    0%{transform:scale(1);background:rgba(10,18,18,0.75);border-color:rgba(217,224,227,0.18);}
    20%{transform:scale(1.02);background:rgba(201,168,124,0.25);border-color:rgba(201,168,124,0.6);box-shadow:0 8px 28px rgba(201,168,124,0.4);}
    50%{transform:scale(0.99);}
    75%{transform:scale(1.01);}
    100%{transform:scale(1);background:rgba(10,18,18,0.75);border-color:rgba(217,224,227,0.18);box-shadow:none;}
  }
  .biz-icon{font-size:1.8rem;margin-bottom:16px;}
  .biz-card h3{font-family:"Cormorant Garamond",serif;font-size:1.35rem;color:#d9e0e3;margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,0.6);}
  .biz-card p{font-size:0.92rem;color:rgba(237,224,206,0.9);line-height:1.75;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,0.5);}

  /* CURRICULUM ACCORDION */
  .accordion-item{border:1px solid rgba(201,168,124,0.2);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .accordion-trigger{width:100%;display:flex;align-items:center;gap:16px;padding:20px 24px;background:rgba(255,255,255,0.04);cursor:pointer;border:none;text-align:left;transition:background 0.2s;font-family:"DM Sans",sans-serif;}
  .accordion-trigger:hover{background:rgba(255,255,255,0.07);}
  .module-num-badge{width:32px;height:32px;background:rgba(201,168,124,0.2);color:var(--sand-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.82rem;font-weight:500;flex-shrink:0;}
  .module-name-text{flex:1;color:var(--off-white);font-size:0.95rem;font-weight:400;}
  .accordion-icon{color:var(--sand);font-size:1.4rem;font-weight:300;transition:transform 0.3s;flex-shrink:0;}
  .accordion-item.open .accordion-icon{transform:rotate(45deg);}
  .accordion-content{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s ease;padding:0 24px;background:rgba(255,255,255,0.02);}
  .accordion-content.open{max-height:300px;padding-top:16px;padding-bottom:20px;}

    t1_text:"Taking this course was a strategically important decision for my business. The knowledge went far beyond basic management skills — it fundamentally changed how we communicate, collaborate, and build relationships with partners and colleagues. Every module brought a unique blend of clarity, support, and motivation.", t1_name:"Alexander", t1_role:"Information business owner",
    t2_text:"The module on emotional intelligence — especially about the importance of rest and learning not to take students\' behavior personally — was a true lifesaver. I now feel far more confident, balanced, and resilient, even when things get difficult at school.", t2_name:"Ekaterina", t2_role:"Secondary school English teacher",
    t3_text:"After completing the course, my small team and I felt like we\'d grown wings. Within just two months of training, we learned how to confidently present my brand. I wholeheartedly recommend this course to any entrepreneur who needs fast, focused results.", t3_name:"Yulia", t3_role:"Owner of a cosmetics clinic and natural skincare brand",
    t4_text:"This course was a genuine revelation and gave powerful momentum to my private practice. I now know how not to take clients\' reactions personally and how to maintain inner calm even in the most challenging situations.", t4_name:"Irina", t4_role:"Corporate English trainer",
    t5_text:"This training became my anchor in overcoming impostor syndrome and helped me untangle a web of limiting beliefs. The course gave me a structured vision of my goals and now I know exactly what my next steps are.", t5_name:"Natalia", t5_role:"Independent entrepreneur",
    t6_text:"From the very first modules, real productive changes began to show up in my work. The program didn\'t just give me knowledge — it gave me working tools for understanding what\'s really behind people\'s behavior.", t6_name:"Tatyana", t6_role:"Business owner",

    m1_title:"The Origins of EI and Why It Matters", m1_body:"How people came to recognize the importance of EI. The history of the term from ancient philosophers to the present day, the evolution of EQ as a concept, key research, and the introduction of SEL programs in educational institutions. How EQ influences different areas of life.",
    m2_title:"The Benefits of EI in Language Teaching", m2_body:"Richard Boyatzis\'s model of emotional intelligence. Practical scenarios: how to maintain a student\'s attention, work with \'withdrawn\' learners, and manage emotional exhaustion. The connection between EI and student motivation, memory, and identity. The role of empathy, emotional resonance, and reflection as tools for educators.",
    m3_title:"Threats to the Brain and Creating a Safe Learning Environment", m3_body:"Brain states that positively and negatively impact learning. Words, formats, and actions perceived as threats: pressure, criticism, comparisons, leading questions. How to work with a student whose brain is in a threat state. Coaching practices for communicating with parents and decision-makers.",
    m4_title:"Neuroscience: The Brain, the Amygdala, and Learning", m4_body:"The \'triune brain\' and the role of each part. The amygdala and its processing of fear and stress — real-life case studies. The prefrontal cortex, working memory, and neuroplasticity. Cortisol and its dangers. How positive and negative emotions affect neural pathway formation and a student\'s progress.",
    m5_title:"The Ideal State for Learning", m5_body:"What an ideal learning environment looks like and how to create it. Dopamine vs. cortisol — motivation and demotivation. Positive and negative emotional attractors. The \'flow\' state and brainwave patterns. The brain\'s two modes — emotional and rational — and how to work with both.",
    m6_title:"Emotional Triggers and the SCARF Model", m6_body:"What a trigger is and how it connects to past experience. Common triggers for educators, techniques for immediate self-regulation, and long-term strategies. The SCARF model — educator behavior through the lens of social factors. How to give feedback and coaching practices for successful teaching.",
    m7_title:"Student Triggers and Trauma: Recognize and Respond", m7_body:"The difference between triggers and trauma in a learning context. Real-life case studies: how trauma continues to live in the body and affect the learning process. Recognition techniques and approaches — coaching, simulations, and exercises.",
    m8_title:"Burnout: Recognizing It and Finding Balance", m8_body:"The stages and symptoms of professional burnout. Emotional exhaustion vs. emotional resilience. Techniques for restoring emotional resources and burnout prevention through emotional hygiene.",
    mb_title:"Bonus: The Financial Side of Your Practice", mb_body:"Practical aspects of running a teaching practice: drafting contracts, navigating payment challenges, setting your rates, exploring different collaboration models, and structuring package offerings.",

    who1_bio:"Валерія почала викладати англійську мову понад 20 років тому і пройшла шлях від приватного репетитора до засновниці власної мовної школи. Її шлях привів до нейронауки та коучингу — сьогодні вона сертифікований Neurolanguage Coach&#174; та Licensed Trainer&#174; в ELC Ltd., яка допомагає викладачам трансформувати свою практику через науку про мозок та емоційний інтелект.",
    who1_tag1:"20+ років досвіду", who1_tag2:"Акредитація ICF &amp; CCE", who1_tag3:"Засновниця English-Up",
    who1_link:"Дізнатися більше про Валерію",
    who2_name:"Наталія Шубнікова", who2_title:"Professional Life &amp; Business Strategic Coach",
    who2_bio:"Наталія збудувала успішну кар\'єру в IT-бізнесі, пройшовши шлях від спеціаліста до топ-менеджера та співзасновника компанії. Керуючи командами та процесами, вона переконалась: справжня ефективність неможлива без розуміння людської природи, мотивації та емоцій. Сьогодні вона сертифікований Life &amp; Business Strategic Coach, яка допомагає будувати усвідомлений і прибутковий професійний шлях.",
    who2_tag1:"Колишній IT топ-менеджер", who2_tag2:"Сертифікований ICF коуч", who2_tag3:"Експерт з бізнес-стратегії",
    who3_name:"Олег Порученко", who3_title:"Невролог &middot; Психолог &middot; Нейропсихолог &middot; Практик реабілітації після ЧМТ",
    who3_bio:"Олег привносить глибоку клінічну експертизу з нейропсихології та реабілітації мозку. Його практика в Центрі реабілітації після ЧМТ дає унікальний, науково обґрунтований погляд на те, як мозок навчається, відновлюється та адаптується — знання, які безпосередньо формують нейронаукову основу цієї програми.",
    who3_tag1:"Клінічний нейропсихолог", who3_tag2:"Спеціаліст з реабілітації мозку", who3_tag3:"Невролог", who3_tag4:"Психолог",
    bio_read:"Читати історію",
    testi_label:"Відгуки", testi_h2:"Що кажуть учасники",
    read_more:"Читати далі ",
    t1_text:"Проходження цього курсу стало для мого проєкту стратегічно важливим рішенням. Ми не лише прокачали розуміння бізнес-процесів, а й кардинально змінили те, як спілкуємось, співпрацюємо та будуємо стосунки з партнерами і колегами. Кожен блок програми приносив унікальне поєднання ясності, підтримки та мотивації.", t1_name:"Олександр", t1_role:"Власник інформаційного бізнесу",
    t2_text:"Блок про емоційний інтелект — особливо про важливість відпочинку і про те, як не сприймати поведінку учнів особисто — став для мене справжнім порятунком. Тепер я почуваюся значно впевненіше, збалансованіше та стійкіше, навіть коли в школі стає складно.", t2_name:"Катерина", t2_role:"Вчителька англійської в середній школі",
    t3_text:"Після курсу в мене і моєї команди немов виросли крила. Вже за два місяці навчання ми навчились впевнено представляти бренд. Щиро рекомендую цей курс усім підприємцям, яким потрібні швидкі, сфокусовані результати.", t3_name:"Юлія", t3_role:"Власниця косметичної клініки та бренду натуральної косметики",
    t4_text:"Цей курс став для мене справжнім відкриттям і дав потужний імпульс моїй практиці. Тепер я знаю, як не сприймати реакції клієнтів особисто та зберігати внутрішній спокій навіть у найскладніших ситуаціях.", t4_name:"Ірина", t4_role:"Корпоративна викладачка",
    t5_text:"Навчання стало для мене точкою опори в подоланні синдрому самозванця і допомогло розплутати клубок обмежувальних переконань. Завдяки курсу я отримала структуроване бачення своїх цілей і тепер точно знаю свої наступні кроки.", t5_name:"Наталія", t5_role:"Приватна підприємниця",
    t6_text:"Вже після перших модулів у моїй роботі почались реальні зміни. Програма дала мені не просто знання, а робочі інструменти для розуміння того, що насправді стоїть за поведінкою людей.", t6_name:"Тетяна", t6_role:"Власниця бізнесу",
    t7_text:"Особливо цінним було усвідомити, як мої емоції безпосередньо впливають на прийняття рішень. Завдяки глибоким практикам я сама дійшла до відповідей на запитання, які раніше викликали лише тривогу. Це абсолютно новий рівень розуміння себе!", t7_name:"Юлія", t7_role:"Власниця мовної школи",
    formats_label:"Формати", formats_h2:"Оберіть свій шлях",
    tab_individuals:"Для приватних осіб", tab_business:"Для бізнесу",
    fmt_webinar_label:"Вебінар", fmt_webinar_h3:"Емоційний Інтелект як ключовий фактор успіху",
    fmt_webinar_p:"Одноразовий онлайн-вебінар — ідеальна точка входу, щоб познайомитись із темою EQ, поставити запитання спікерам і зрозуміти, як це працює на практиці.",
    fmt_webinar_link:"Дізнатися більше про вебінар",
    fmt_course_label:"Повний курс", fmt_course_h3:"Емоційний Інтелект — ключовий фактор вашого успіху",
    fmt_course_p:"Повноцінний курс із 9 модулів з практичними завданнями, живими сесіями та спільнотою однодумців. Гібридний формат: уроки в записі + щотижневі зустрічі.",
    fmt_course_link:"Дізнатися більше про курс",
    biz_intro:"Ми адаптуємо нашу програму під будь-яку сферу та під конкретний запит вашої команди.",
    biz1_h4:"Повний корпоративний курс", biz1_p:"Комплексна програма навчання, адаптована під специфіку вашого бізнесу та команди.",
    biz2_h4:"Тематичні вебінари", biz2_p:"Одноразові вебінари з ключових аспектів EQ з фокусом на ваш конкретний запит.",
    biz3_h4:"Воркшопи", biz3_p:"Інтенсивні практичні воркшопи для відпрацювання навичок у реальних ситуаціях команди.",
    biz_cta:"Обговорити співпрацю", biz_cta_url:"https://form.jotform.com/261165916881061",
    curr_label:"Програма курсу", curr_h2:"9 модулів трансформаційної практики",
    m1_title:"Виникнення ЕІ та його важливість", m1_body:"Як люди дійшли до важливості ЕІ та його вивчення. Історія терміна від давніх філософів до наших днів, еволюція поняття EQ, ключові дослідження та впровадження програм SEL в освітніх закладах. Вплив EQ на різні сфери життя людини.",
    m2_title:"Переваги ЕІ у викладанні іноземної мови", m2_body:"Модель ЕІ Річарда Бояціса. Практичні сценарії: як утримати увагу учня, працювати із «закритими» студентами, справлятися з емоційним виснаженням. Зв\'язок ЕІ з мотивацією, пам\'яттю та ідентичністю учня. Роль емпатії, емоційного резонансу та рефлексії як інструментів викладача.",
    m3_title:"Загрози для мозку та безпечне середовище навчання", m3_body:"Стани мозку, що позитивно й негативно впливають на навчання. Слова, формати й дії, що сприймаються як загрози: тиск, критика, порівняння, запитання-пастки. Як працювати з учнем, мозок якого перебуває в стані загрози. Коучингові практики для комунікації з батьками та особами, що приймають рішення.",

let currentLang = "en";

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang-btn").forEach((btn,i) => {
    btn.classList.toggle("active", (i===0&&lang==="en")||(i===1&&lang==="uk"));
  });
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[lang][key] !== undefined) el.innerHTML = i18n[lang][key];
    const urlKey = key + "_url";
    if (i18n[lang][urlKey] !== undefined) el.setAttribute("href", i18n[lang][urlKey]);
  });
  document.querySelectorAll("[data-i18n-href]").forEach(el => {
    const urlKey = el.getAttribute("data-i18n-href");
    if (i18n[lang][urlKey] !== undefined) el.setAttribute("href", i18n[lang][urlKey]);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (i18n[lang][key] !== undefined) el.placeholder = i18n[lang][key];
  });
  document.title = lang==="uk" ? "MindLander — Емоційний Інтелект" : "MindLander — Emotional Intelligence";
  const activeTabBtn = document.querySelector(".tab-btn.active");
  if (activeTabBtn) activeTabBtn.classList.add("active");
  const activePill = document.querySelector(".reviews-dot.active");
  if (!activePill) reviewsGoTo(0);
}

function switchTab(name, btn) {
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  if(btn) btn.classList.add("active");
}
function switchTabBiz(){
  switchTab("business", document.querySelectorAll(".tab-btn")[1]);
}

function showModal(type){ document.getElementById(type+"-modal").style.display="flex"; document.body.style.overflow="hidden"; }
function closeModal(){ document.querySelectorAll(".modal-overlay").forEach(m=>m.style.display="none"); document.body.style.overflow=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function toggleMenu(){
  const menu = document.getElementById("mobileMenu");
  const burger = document.getElementById("hamburger");
  menu.classList.toggle("open");
  burger.classList.toggle("open");
}
function closeMenu(){
  document.getElementById("mobileMenu").classList.remove("open");
  document.getElementById("hamburger").classList.remove("open");
}
// Close menu on outside click
document.addEventListener("click", e=>{
  const menu = document.getElementById("mobileMenu");
  const burger = document.getElementById("hamburger");
  if(!menu.contains(e.target) && !burger.contains(e.target)){
    menu.classList.remove("open");
    burger.classList.remove("open");
  }
});

function animateTag(el){
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  el.addEventListener("animationend",()=>el.classList.remove("pop"),{once:true});
}

document.querySelectorAll(".offering-card .btn-primary").forEach(btn=>{
  btn.addEventListener("click", e=>e.stopPropagation());
});

document.querySelectorAll(".bio-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const bio = btn.closest(".speaker-card").querySelector(".bio-content");
    const arrow = btn.querySelector(".bio-arrow");
    const label = btn.querySelector(".bio-toggle-text");
    const isOpen = bio.style.maxHeight && bio.style.maxHeight !== "0px";
    if(isOpen){ bio.style.maxHeight="0px"; bio.style.opacity="0"; arrow.style.transform="rotate(0deg)"; label.innerHTML=i18n[currentLang]["bio_read"]||"Read their story"; }
    else { bio.style.maxHeight=bio.scrollHeight+"px"; bio.style.opacity="1"; arrow.style.transform="rotate(180deg)"; label.innerHTML=currentLang==="uk"?"Згорнути":"Collapse"; }
  });
});

document.querySelectorAll(".accordion-trigger").forEach(btn => {
  btn.addEventListener("click", () => {
    const item = btn.closest(".accordion-item");
    const content = item.querySelector(".accordion-content");
    const isOpen = item.classList.contains("open");
    document.querySelectorAll(".accordion-item").forEach(i=>{ i.classList.remove("open"); const c=i.querySelector(".accordion-content"); if(c) c.classList.remove("open"); });
    if(!isOpen){ item.classList.add("open"); content.classList.add("open"); }
  });
});

document.querySelectorAll(".modal-acc-trigger").forEach(btn => {
  btn.addEventListener("click", () => {
    const item = btn.closest(".modal-acc-item");
    const content = item.querySelector(".modal-acc-content");
    const isOpen = item.classList.contains("open");
    document.querySelectorAll(".modal-acc-item").forEach(i=>{ i.classList.remove("open"); const c=i.querySelector(".modal-acc-content"); if(c) c.classList.remove("open"); });
    if(!isOpen){ item.classList.add("open"); content.classList.add("open"); }
  });
});

function toggleReview(btn){
  const text = btn.previousElementSibling.querySelector(".review-text");
  const fade = btn.previousElementSibling.querySelector(".review-fade");
  const isExpanded = text.classList.contains("expanded");
  text.classList.toggle("expanded"); fade.classList.toggle("hidden"); btn.classList.toggle("expanded");
  const span = btn.querySelector("span[data-i18n]");
  if(span) span.innerHTML = isExpanded ? (i18n[currentLang]["read_more"]||"Read more ") : (currentLang==="uk"?"Згорнути ":"Collapse ");
}

(function(){
  const track = document.getElementById("reviewsTrack");
  const dotsContainer = document.getElementById("reviewsDots");
  const cards = track.querySelectorAll(".review-card");
  let current = 0;
  function getVisible(){ return window.innerWidth<=600?1:window.innerWidth<=900?2:3; }
  function totalSlides(){ return Math.ceil(cards.length/getVisible()); }
  function buildDots(){
    dotsContainer.innerHTML="";
    for(let i=0;i<totalSlides();i++){
      const d=document.createElement("button");
      d.className="reviews-dot"+(i===current?" active":"");
      d.onclick=()=>reviewsGoTo(i);
      dotsContainer.appendChild(d);
    }
  }
  window.reviewsGoTo = function(index){
    current=Math.max(0,Math.min(index,totalSlides()-1));
    const visible=getVisible();
    const cardWidth=cards[0].offsetWidth+28;
    track.style.transform=`translateX(-${current*visible*cardWidth}px)`;
    document.getElementById("reviewsPrev").disabled=current===0;
    document.getElementById("reviewsNext").disabled=current>=totalSlides()-1;
    dotsContainer.querySelectorAll(".reviews-dot").forEach((d,i)=>d.classList.toggle("active",i===current));
  };
  window.slideReviews = dir => reviewsGoTo(current+dir);
  buildDots(); reviewsGoTo(0);
  window.addEventListener("resize",()=>{ buildDots(); reviewsGoTo(0); });
})();

const revObs = new IntersectionObserver(entries=>{ entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("visible"); }); },{threshold:0.1});
document.querySelectorAll(".reveal").forEach(el=>revObs.observe(el));

const qObs = new IntersectionObserver(entries=>{ entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("visible"); }); },{threshold:0.1});
document.querySelectorAll(".quote-item").forEach((el,i)=>{ el.style.transitionDelay=(i*0.1)+"s"; qObs.observe(el); });

setLang("en");
</script>
